# Weekly scrape of EVERY graded Pokemon card alt.xyz indexes (~65k), so cards
# outside the nightly scope (chase-checklist species, roster
# candidates) still get refreshed. Same pipeline, NIGHTLY_SCOPE=full.
name: weekly scrape (full index)
on:
  schedule:
    - cron: "0 9 * * 0"   # Sunday 09:00 UTC, after that day's nightly run
  workflow_dispatch:
concurrency:
  group: scrape
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: full scrape + ingest + rebuild latest/
        env:
          NIGHTLY_SCOPE: full
          NIGHTLY_WORKERS: "6"
          NIGHTLY_DELAY: "0"
        run: nightly/run_nightly.sh
      # Re-derives on top of origin/main instead of rebasing if another run's
      # commit landed meanwhile: on 2026-09-20 the nightly's push landed seconds
      # before this job's checkout and the rebase conflicted on every generated
      # file, losing the run.
      - name: commit history/ and latest/
        env:
          COMMIT_PREFIX: weekly full
        run: nightly/commit_results.sh
      # The raw run (~65k cards, every sale), so a failed commit can be
      # re-ingested by hand instead of re-scraped for 5 h.
      - name: keep the raw run as a downloadable artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-full-${{ github.run_id }}
          path: |
            snapshots/*/cards.csv
            snapshots/*/sales.csv
            snapshots/*/run.log
          retention-days: 7
