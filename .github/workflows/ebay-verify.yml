# eBay verification of the feed's eBay Buy It Nows (2026-10-06): asks eBay's own Browse API
# whether each listing is still live (alt.xyz re-serves ended ones for months) and drops the
# dead ones. ~4,800 lookups of eBay's 5,000-a-day budget, which resets at 07:00 UTC. Its own
# concurrency group since 2026-10-17: it never talks to alt.xyz, and run_ebay_verify.sh's commit
# loop re-applies the day's answers on top of origin/main when a push is rejected, so it need not
# queue behind the nightly, weekly and listings-refresh runs (group `scrape`). It used to share
# that group, and GitHub keeps only one *pending* run per group: a verify queued behind the
# nightly was cancelled when a listings refresh queued up too (10-11 and 10-14), hence the second
# cron slot + nightly/already_ran.sh, both kept.
name: ebay verify (Buy It Now listings still live?)
on:
  schedule:
    - cron: "15 7,9 * * *"   # 07:15 UTC, just after eBay's daily quota reset; 09:15 = retry if that run was cancelled
  workflow_dispatch:
    inputs:
      budget:
        description: "lookups this run (smoke test with a small number; empty = 4800 and commit)"
        required: false
        default: ""
concurrency:
  group: ebay-verify
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: stop if today's verify already landed (the 09:15 slot is only a retry)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nightly/already_ran.sh "ebay verify $(date -u +%F)" "$(date -u +%FT07:00:00Z)" && echo "skip=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: ask eBay + apply + rebuild latest/ + commit
        if: steps.guard.outputs.skip != '1'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_BUDGET: ${{ inputs.budget || '4800' }}
          NO_COMMIT: ${{ inputs.budget != '' && '1' || '' }}
          # Watchlist sweep (history/watchlist_listings.py): OFF until these two secrets exist. Either a
          # GitHub contents-API URL for Sid's private watchlist.csv + a classic PAT with `repo` scope
          # (a fine-grained token cannot reach another user's repo), or a token-protected URL on his
          # server + its token. Leaves the verify ~300 fewer lookups on the days it runs.
          WATCHLIST_URL: ${{ secrets.WATCHLIST_URL }}
          WATCHLIST_TOKEN: ${{ secrets.WATCHLIST_TOKEN }}
          # Flagged sales (history/flagged_sales.py, 2026-10-28): Sid's flagged_sales.csv sits next to
          # watchlist.csv, so by default it is read from WATCHLIST_URL with the file name swapped, with
          # WATCHLIST_TOKEN. These two override that only when they exist.
          FLAGGED_SALES_URL: ${{ secrets.FLAGGED_SALES_URL }}
          FLAGGED_SALES_TOKEN: ${{ secrets.FLAGGED_SALES_TOKEN }}
          WATCHLIST_EBAY_BUDGET: "360"
          # Sale title check (history/sale_title_check.py, 2026-10-20): eBay's title of every held-back
          # eBay sale, this many lookups a day off the same 5,000 (a smoke run asks 20); 0 skips it.
          TITLE_CHECK_BUDGET: ${{ inputs.budget != '' && '20' || '400' }}
          # history/sales + daily come from the release tagged `store` (history/store.py, 2026-10-17)
          STORE_MODE: "release"
          GH_TOKEN: ${{ github.token }}
        run: nightly/run_ebay_verify.sh
      - name: keep the raw run as a downloadable artifact (7 days)
        if: always() && steps.guard.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ebay-verify-${{ github.run_id }}
          path: snapshots/ebay
          retention-days: 7
