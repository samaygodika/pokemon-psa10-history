# Nightly scrape of PokeSniper's roster candidates + the vintage checklist. Runs the same nightly/run_nightly.sh a laptop would,
# then commits history/ and latest/ back to the repo. PokeSniper's server
# downloads latest/ straight from this repo's raw GitHub URLs.
# A manual run with `limit` set is a smoke test: it scrapes N cards and
# skips the history/commit steps so a partial day never lands in history/.
name: nightly scrape (roster candidates + vintage checklist)
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 03:00 ET, after the day's eBay sales settle
  workflow_dispatch:
    inputs:
      limit:
        description: "scrape only the first N cards (smoke test)"
        required: false
        default: ""
concurrency:
  group: scrape
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scrape + ingest + rebuild latest/
        env:
          NIGHTLY_WORKERS: "6"
          NIGHTLY_DELAY: "0.05"
          NIGHTLY_LIMIT: ${{ inputs.limit }}
          NIGHTLY_SKIP_HISTORY: ${{ inputs.limit != '' && '1' || '' }}
        run: nightly/run_nightly.sh
      # Re-derives on top of origin/main instead of rebasing if another run's
      # commit landed meanwhile (the generated files always conflict).
      - name: commit history/ and latest/
        if: ${{ inputs.limit == '' }}
        run: nightly/commit_results.sh
      # The raw run, so a failed commit can be re-ingested by hand
      # (python3 history/ingest.py <dir> --date <day>) instead of re-scraped.
      - name: keep the raw run as a downloadable artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            snapshots/*/cards.csv
            snapshots/*/sales.csv
            snapshots/*/listings.csv
            snapshots/*/run.log
          retention-days: 7
